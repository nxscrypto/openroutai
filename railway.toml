# Railpack configuration for Railway.
# This tells Railway exactly how to build and serve the app, with no guessing.
# Without this file, Railpack requires "start.sh" or a Procfile at the repo root.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10